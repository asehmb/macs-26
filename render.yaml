services:
  - type: web
    name: realitycheck
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Optional TURN relay for networks that block peer-to-peer (read at build time by Vite).
      - key: VITE_TURN_URL
        sync: false
      - key: VITE_TURN_USER
        sync: false
      - key: VITE_TURN_PASS
        sync: false
